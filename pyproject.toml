[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manim-lectern"
version = "0.1.0.dev0"
description = "Write lecture slides as plain-text scripts and turn them into animated manim-slides presentations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Steven Libby", email = "libbys@up.edu" }]
dependencies = [
    # manim 0.22 removed a setting manim-slides 5.7 still uses; see "Known workarounds" in README.md.
    "manim>=0.18,<0.21",
    "manim-slides>=5",
]

[project.scripts]
lectern = "lectern.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lectern"]
